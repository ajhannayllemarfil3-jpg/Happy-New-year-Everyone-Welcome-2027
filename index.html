<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireworks Show</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#02030a;--fg:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:2}
button{background:rgba(255,255,255,.12);color:var(--fg);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:12px 20px;font-size:16px;backdrop-filter:blur(6px)}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(2,3,10,.85);z-index:3;text-align:center}
#start h1{margin:0;font-size:30px}
#start button{font-size:20px;padding:16px 32px;background:linear-gradient(90deg,#ff3d81,#ffb400);border:0;color:#111;font-weight:700}
#banner{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;text-align:center;z-index:2;pointer-events:none;padding:0 12px;font-weight:900;color:#fff;line-height:1.08;animation:pulse 2.5s ease-in-out infinite;text-shadow:0 3px 6px rgba(0,0,0,.8)}
#banner span{display:block;font-size:clamp(34px,12vw,80px);letter-spacing:1px}
#banner .l1{text-shadow:0 0 12px #ff3d81,0 0 30px #ff3d81,0 3px 6px #000}
#banner .l2{text-shadow:0 0 12px #5ef2ff,0 0 30px #5ef2ff,0 3px 6px #000}
#banner .l3{text-shadow:0 0 12px #c77dff,0 0 30px #c77dff,0 3px 6px #000}
#banner .l4{font-size:clamp(22px,7vw,44px);font-style:italic;font-weight:700;color:#ffe9a8;text-shadow:0 0 14px #ffb400,0 3px 6px #000;margin-top:6px}
#banner .l5{font-size:clamp(54px,20vw,140px);color:#ffd54a;text-shadow:0 0 14px #ff9d00,0 0 40px #ff9d00,0 0 70px #ff3d81,0 4px 8px #000}
@keyframes pulse{50%{transform:scale(1.07)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="banner"><span class="l1">✨ Happy</span><span class="l2">Newyear</span><span class="l3">Everyone</span><span class="l4">🎉 Welcome 🎉</span><span class="l5">2027</span></div>
<div id="start"><h1>🎉 Happy New Year 2027! 🎉</h1><p>Tap to start with music. Tap the sky to launch your own!</p><button id="go">Start ▶</button></div>
<div id="ui"><button id="mus">🎵 Music: On</button><button id="auto">✨ Auto: On</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

/* ---------- Audio ---------- */
let ac,master,sfx,musicOn=true,started=false,step=0,nextT=0;
// Auld Lang Syne (traditional, public domain) in C major
const seq=[[523.25,3],[523.25,1],[523.25,2],[659.25,2],[587.33,3],[523.25,1],[587.33,2],[659.25,2],[523.25,3],[523.25,1],[659.25,2],[783.99,2],[880,6],[392,2],[523.25,3],[523.25,1],[523.25,2],[659.25,2],[587.33,3],[523.25,1],[587.33,2],[659.25,2],[523.25,3],[440,1],[440,2],[392,2],[523.25,6],[392,2]];
let acc=0;const mel=seq.map(([f,d])=>{const o={f,s:acc,d};acc+=d;return o});
const C_={r:130.81,t:[261.63,329.63,392]},G_={r:98,t:[196,246.94,293.66]},F_={r:87.31,t:[174.61,220,261.63]};
const prog=[C_,G_,C_,F_,C_,G_,F_,C_];
function kick(t,v){
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.4);
}
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
  sfx=ac.createGain();sfx.gain.value=.8;sfx.connect(ac.destination);
  nextT=ac.currentTime+.1;
  setInterval(sched,100);
}
function tone(f,t,d,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function sched(){
  if(!ac)return;
  const spb=60/96/2; // eighth notes
  while(nextT<ac.currentTime+.3){
    if(musicOn){
      const p=step%64,bar=Math.floor(p/8),ch=prog[bar],i=p%8;
      if(i===0){ch.t.forEach(n=>tone(n,nextT,spb*8,'triangle',.06));tone(ch.r,nextT,spb*7,'sine',.22)}
      if(i%4===0)tone(ch.r*2,nextT,spb*3,'triangle',.1);
      if(i%4===0)kick(nextT,.25);
      if(i%2===1)noise(nextT,.06,7000,.12,'highpass');
      mel.forEach(m=>{if(m.s===p){tone(m.f,nextT,spb*m.d*1.1,'triangle',.18);tone(m.f*2,nextT,spb*m.d*.8,'sine',.05)}});
      if(p===0&&step>0)noise(nextT,1.2,6000,.1,'highpass');
      if(p===48){const d=Math.max(0,(nextT-ac.currentTime)*1000);for(let k=0;k<14;k++)setTimeout(launch,d+k*110)}
    }
    nextT+=spb;step++;
  }
}
function noise(t,d,freq,vol,type){
  const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=ac.createBufferSource();s.buffer=b;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(sfx);s.start(t);
}
function launchSound(){if(!ac)return;noise(ac.currentTime,.6,2500,.06,'highpass')}
function boomSound(big){
  if(!ac)return;const t=ac.currentTime;
  noise(t,big?1.1:.7,big?300:500,big?.9:.55,'lowpass');
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(30,t+.5);
  g.gain.setValueAtTime(big?.5:.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);
  o.connect(g);g.connect(sfx);o.start(t);o.stop(t+.7);
  for(let i=0;i<5;i++)noise(t+.15+Math.random()*.7,.05,4000+Math.random()*3000,.12,'highpass');
}

/* ---------- Fireworks ---------- */
const rockets=[],parts=[],stars=[];
for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.2+.2,p:Math.random()*6});
const rnd=(a,b)=>a+Math.random()*(b-a);
const palettes=[[0,40],[200,260],[280,330],[90,150],[40,60],[170,200]];

function launch(tx,ty){
  const x=tx??rnd(W*.12,W*.88), y=ty??rnd(H*.12,H*.45);
  rockets.push({x:x+rnd(-30,30),y:H,tx:x,ty:y,vy:-rnd(10,13),hue:rnd(0,360),trail:[]});
  launchSound();
}
function explode(x,y,hue){
  const type=Math.floor(Math.random()*5), n=type===4?140:rnd(150,230)|0, big=Math.random()<.35;
  const pal=palettes[Math.floor(Math.random()*palettes.length)];
  const multi=Math.random()<.4;
  const sp=rnd(3.5,6.5)*(big?1.3:1);
  for(let i=0;i<n;i++){
    let a=Math.PI*2*i/n,s=sp;
    if(type===0)s=sp*rnd(.2,1);                         // sphere
    if(type===1){s=sp*(i%2?1:.55)}                      // double ring
    if(type===2){const t=a;a=t;s=sp*(1-.5*Math.abs(Math.sin(t*3)))*1.2} // flower
    if(type===3){a=rnd(0,6.28);s=sp*rnd(.1,1.1)}        // burst random
    if(type===4){const t=a;const hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      parts.push(mk(x,y,hx*sp/14,hy*sp/14,multi?rnd(pal[0],pal[1]):hue,type));continue}
    const h=multi?rnd(pal[0],pal[1]):(Math.random()<.2?hue+180:hue);
    parts.push(mk(x,y,Math.cos(a)*s,Math.sin(a)*s,h,type));
  }
  // glow flash
  parts.push({flash:1,x,y,hue});
  boomSound(big);
}
function mk(x,y,vx,vy,h,type){
  return{x,y,vx,vy,hue:h,life:1,decay:rnd(.008,.016),size:rnd(1.2,2.6),twinkle:Math.random()<.3,trail:[]}
}

let last=0,autoOn=true,autoT=0;
function frame(t){
  const dt=Math.min((t-last)/16.67||1,3);last=t;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(2,3,10,.22)';ctx.fillRect(0,0,W,H);
  // stars
  for(const s of stars){ctx.globalAlpha=.3+.3*Math.sin(t/700+s.p);ctx.fillStyle='#fff';ctx.fillRect(s.x*W,s.y*H,s.r,s.r)}
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';
  // auto show
  if(autoOn&&started){autoT-=dt;if(autoT<=0){const k=2+Math.floor(Math.random()*4);for(let i=0;i<k;i++)setTimeout(()=>launch(),i*160);autoT=rnd(14,34)}}
  // rockets
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.y+=r.vy*dt;r.vy*=.985;r.x+=(r.tx-r.x)*.02;
    r.trail.push([r.x,r.y]);if(r.trail.length>12)r.trail.shift();
    r.trail.forEach((p,j)=>{ctx.fillStyle=`hsla(40,100%,${60+j*3}%,${j/14})`;ctx.beginPath();ctx.arc(p[0],p[1],1.6,0,6.28);ctx.fill()});
    if(r.y<=r.ty||r.vy>-1.2){explode(r.x,r.y,r.hue);rockets.splice(i,1)}
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.flash){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,160);g.addColorStop(0,`hsla(${p.hue},100%,80%,${.35*p.flash})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(p.x-160,p.y-160,320,320);p.flash-=.08*dt;if(p.flash<=0)parts.splice(i,1);continue}
    p.vx*=.975;p.vy=p.vy*.975+.045*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.decay*dt;
    p.trail.push([p.x,p.y]);if(p.trail.length>6)p.trail.shift();
    if(p.life<=0){parts.splice(i,1);continue}
    let a=p.life;if(p.twinkle&&p.life<.5&&Math.random()<.4)a*=.2;
    const l=50+p.life*30;
    ctx.strokeStyle=`hsla(${p.hue},100%,${l}%,${a*.5})`;ctx.lineWidth=p.size*.8;ctx.beginPath();
    p.trail.forEach((q,j)=>j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
    ctx.fillStyle=`hsla(${p.hue},100%,${l+10}%,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.5+p.life*.5),0,6.28);ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Controls ---------- */
document.getElementById('go').onclick=()=>{
  document.getElementById('start').remove();started=true;initAudio();
  launch(W*.5,H*.3);setTimeout(()=>launch(W*.25,H*.35),300);setTimeout(()=>launch(W*.75,H*.3),600);
};
cv.addEventListener('pointerdown',e=>{if(started){if(ac&&ac.state==='suspended')ac.resume();launch(e.clientX,e.clientY);setTimeout(()=>launch(e.clientX-80,e.clientY+30),120);setTimeout(()=>launch(e.clientX+80,e.clientY+30),240)}});
document.getElementById('mus').onclick=e=>{musicOn=!musicOn;e.target.textContent='🎵 Music: '+(musicOn?'On':'Off')};
document.getElementById('auto').onclick=e=>{autoOn=!autoOn;e.target.textContent='✨ Auto: '+(autoOn?'On':'Off')};
</script>
</body>
</html>
